name: Archive Cubic 108

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and archive Cubic 108
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE='cubic_2026.08.108-release~202608210019~ubuntu24.04.1_all.deb'
          URL="https://ppa.launchpadcontent.net/cubic-wizard/release/ubuntu/pool/main/c/cubic/$FILE"
          DIR='packages/cubic/2026.08.108'
          mkdir -p "$DIR"
          curl -fL --retry 3 --connect-timeout 20 "$URL" -o "$DIR/$FILE"
          (cd "$DIR" && sha256sum "$FILE" > SHA256SUMS.txt)
          {
            printf '%s\n' '# Cubic 2026.08.108 — known-good Ubuntu 24.04 package'
            printf '\n'
            printf '%s\n' 'Archived package:'
            printf '\n'
            printf '%s\n' "\`$FILE\`"
            printf '\n'
            printf '%s\n' 'This version was retained after Cubic 2026.08.109 failed during'
            printf '%s\n' '"Copy important files from the original disk image", while 2026.08.108'
            printf '%s\n' 'successfully passed the same operation in the same workflow.'
            printf '\n'
            printf '%s\n' 'Source: Cubic release PPA for Ubuntu 24.04.'
            printf '\n'
            printf '%s\n' 'Install/downgrade:'
            printf '\n'
            printf '%s\n' '\`\`\`bash'
            printf '%s\n' "sudo apt install --allow-downgrades ./$FILE"
            printf '%s\n' 'sudo apt-mark hold cubic'
            printf '%s\n' '\`\`\`'
            printf '\n'
            printf '%s\n' 'Verify:'
            printf '\n'
            printf '%s\n' '\`\`\`bash'
            printf '%s\n' 'sha256sum -c SHA256SUMS.txt'
            printf '%s\n' '\`\`\`'
          } > "$DIR/README.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR"
          if git diff --cached --quiet; then
            echo 'Archive already current.'
            exit 0
          fi
          git commit -m 'Archive known-good Cubic 2026.08.108 package'
          git push
